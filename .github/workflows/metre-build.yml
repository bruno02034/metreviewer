name: MetreViewer build

on:
  workflow_dispatch:
  push:
    branches:
      - metre

# publica os instaladores como release (pré-lançamento) do fork
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/metre-flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "metre-nightly"
